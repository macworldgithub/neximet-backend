# Ubuntu/Debian: this file is included inside nginx's http context.
server_names_hash_bucket_size 64;
map $http_upgrade $neximet_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=neximet_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name backend.neximet.com www.backend.neximet.com portal.neximet.com www.portal.neximet.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backend.neximet.com www.backend.neximet.com;
    include /etc/nginx/snippets/neximet-tls.conf;
    access_log /var/log/nginx/neximet-backend.access.log;
    error_log /var/log/nginx/neximet-backend.error.log;
    gzip off;
    # Same-origin policy remains enforced by Express and Socket.IO.
    # Both backend hostnames serve directly, so CORS preflights and WS upgrades
    # never depend on a redirect.
    location ~ ^/api/auth/(login|forgot-password|ceo-reset-password)$ {
        limit_req zone=neximet_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/neximet-proxy.conf;
        proxy_pass http://127.0.0.1:4052;
    }
    location ~ /\. { deny all; }
    location / {
        include /etc/nginx/snippets/neximet-proxy.conf;
        proxy_pass http://127.0.0.1:4052;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.neximet.com;
    include /etc/nginx/snippets/neximet-tls.conf;
    access_log /var/log/nginx/neximet-portal.access.log;
    error_log /var/log/nginx/neximet-portal.error.log;
    location ~ /\. { deny all; }
    location / {
        include /etc/nginx/snippets/neximet-proxy.conf;
        proxy_pass http://127.0.0.1:4051;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.portal.neximet.com;
    include /etc/nginx/snippets/neximet-tls.conf;
    # A single portal origin keeps login storage and PWA registrations consistent.
    return 308 https://portal.neximet.com$request_uri;
}
