# Enable this HTTP-only site before requesting the first certificate.
# Install as /etc/nginx/sites-available/neximet.conf and symlink into sites-enabled.
server_names_hash_bucket_size 64;
server {
    listen 80;
    listen [::]:80;
    server_name backend.neximet.com www.backend.neximet.com portal.neximet.com www.portal.neximet.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 503; }
}
